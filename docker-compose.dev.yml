version: '3.8'

services:
  # Qdrant Vector Database (Development)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=DEBUG
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ArangoDB Graph Database (Development)
  arangodb:
    image: arangodb:3.11.5
    container_name: arangodb-dev
    ports:
      - "8529:8529"
    volumes:
      - arango_dev_data:/var/lib/arangodb3
      - arango_dev_apps_data:/var/lib/arangodb3-apps
      - ./setup/arangodb:/docker-entrypoint-initdb.d:ro
    environment:
      - ARANGO_ROOT_PASSWORD=development
      - ARANGO_NO_AUTH=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Development Application (hot reload ready)
  semantic-search-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: semantic-search-dev
    depends_on:
      qdrant:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./examples:/app/examples:ro
      - ./setup:/app/setup:ro
      - semantic_dev_logs:/app/logs
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ARANGO_HOST=arangodb
      - ARANGO_PORT=8529
      - ARANGO_ROOT_PASSWORD=development
      - ZIG_ENV=development
    ports:
      - "8080:8080"  # If we add HTTP API later
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]  # Keep container running for development
    networks:
      - semantic_dev_network

  # Database initialization service for development
  db-init:
    image: curlimages/curl:8.5.0
    container_name: db-init-dev
    depends_on:
      qdrant:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    volumes:
      - ./setup:/setup:ro
    restart: "no"
    command: >
      sh -c "
        echo 'Initializing Qdrant collection...' &&
        curl -X PUT http://qdrant:6333/collections/semantic_chunks \
          -H 'Content-Type: application/json' \
          -d '{
            \"vectors\": {
              \"size\": 768,
              \"distance\": \"Cosine\"
            }
          }' &&
        echo 'Qdrant collection created successfully' &&
        echo 'Waiting for ArangoDB to be fully ready...' &&
        sleep 5 &&
        echo 'ArangoDB initialization complete'
      "
    networks:
      - semantic_dev_network

volumes:
  qdrant_dev_data:
    driver: local
  arango_dev_data:
    driver: local
  arango_dev_apps_data:
    driver: local
  semantic_dev_logs:
    driver: local

networks:
  semantic_dev_network:
    driver: bridge